spring:
  application:
    name: ed-gateway

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        enabled: true
        register: true
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /actuator/health
        
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:4200
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:

        # ── Microservicio Autenticación (ACTIVO: 8081) ─────────────────────────
        - id: ed-ms-autenticacion
          uri: lb://ed-ms-autenticacion
          predicates:
            - Path=/autenticacion/**
          filters:
            - StripPrefix=1

        # ── Microservicio Administración (ACTIVO: 8082) ─────────────────────────
        - id: ed-ms-administracion
          uri: lb://ed-ms-administracion
          predicates:
            - Path=/administracion/**
          filters:
            - StripPrefix=1

        
         # ── Microservicio Gestion Academica (ACTIVO: 8083) ─────────────────────────
        - id: ed-ms-gestion-academica
          uri: lb://ed-ms-gestion-academica
          predicates:
            - Path=/gestion-academica/**
          filters:
            - StripPrefix=1

         # ── Microservicio Notas (ACTIVO: 8084) ─────────────────────────
        - id: ed-ms-notas
          uri: lb://ed-ms-notas
          predicates:
            - Path=/notas/**
          filters:
            - StripPrefix=1

      # ── Microservicio Inteligencia Artificial (ACTIVO: 8085) ─────────────────────────
        - id: ed-ms-ia
          uri: lb://ed-ms-ia
          predicates:
            - Path=/ia/**
          filters:
            - StripPrefix=1
        
      # ── Microservicio Administración (ACTIVO: 8086) ─────────────────────────
        - id: ed-ms-configuracion-institucional
          uri: lb://ed-ms-configuracion-institucional
          predicates:
            - Path=/configuracion-institucional/**
          filters:
            - StripPrefix=1

server:
  port: 8080

security:
  jwt:
    secret-key: czyYSEj017tCB8M8mnOSvhgV4gSdI4P5Bql+3HrWZtM=
  public-paths:
    - /autenticacion/eduplanner/auth/login
    - /autenticacion/eduplanner/auth/forgot-password
    - /autenticacion/eduplanner/auth/reset-password
    - /autenticacion/eduplanner/auth/activation-account
    - /administracion/eduplanner/internal
    - /administracion/eduplanner/support
    - /eduplanner/actuator/health

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never