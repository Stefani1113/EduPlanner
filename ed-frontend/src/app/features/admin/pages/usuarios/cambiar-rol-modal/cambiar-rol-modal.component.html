<div class="overlay" (click)="onOverlayClick($event)">
  <div class="modal">

    <h3>Cambiar rol</h3>
    <p class="subtitulo">Usuario: <strong>{{ nombreUsuario }}</strong></p>

    <ng-container *ngIf="opciones.length > 0; else sinOpciones">

      <div class="form-group">
        <label>Nuevo rol</label>
        <select class="input" [(ngModel)]="idRoleDestino">
          <option *ngFor="let op of opciones" [value]="op.idRole">{{ op.label }}</option>
        </select>
      </div>

      <div class="form-group" *ngIf="requierePosicion">
        <label>Nuevo cargo *</label>
        <input class="input" type="text" [(ngModel)]="position" placeholder="Ej: Coordinador académico">
      </div>

      <div class="error" *ngIf="error">{{ error }}</div>

      <div class="acciones">
        <button type="button" class="btn-cancelar" (click)="cerrar.emit()">Cancelar</button>
        <button type="button" class="btn-confirmar" [disabled]="enviando" (click)="confirmar()">
          {{ enviando ? 'Guardando...' : 'Confirmar' }}
        </button>
      </div>

    </ng-container>

    <ng-template #sinOpciones>
      <p class="sin-opciones">Este rol no tiene cambios de rol permitidos.</p>
      <div class="acciones">
        <button type="button" class="btn-cancelar" (click)="cerrar.emit()">Cerrar</button>
      </div>
    </ng-template>

  </div>
</div>
