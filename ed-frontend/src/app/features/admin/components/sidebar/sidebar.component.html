<div class="sidebar-backdrop" *ngIf="abierto" (click)="cerrarMenu()"></div>

<div class="sidebar" [class.abierto]="abierto">

  <div class="sidebar-content">

    <nav class="menu">

      <div class="menu-group">

        <p class="section-title">
          PRINCIPAL
        </p>

        <a
          routerLink="/admin/dashboard"
          class="menu-item"
        >
          <span>Mi institución</span>
        </a>

      </div>


      <div class="menu-group">

        <p class="section-title">
          ACADÉMICO
        </p>

        <a
          routerLink="/admin/horarios"
          routerLinkActive="active"
          class="menu-item"
        >
          <span>Horarios</span>
        </a>

        <a
          routerLink="/admin/emergencia"
          routerLinkActive="active"
          class="menu-item"
        >
          <span>Emergencia</span>
        </a>

        <a
          routerLink="/admin/docentes"
          routerLinkActive="active"
          class="menu-item"
        >
          <span>Docentes</span>
        </a>

        <a
          routerLink="/admin/asistencia"
          routerLinkActive="active"
          class="menu-item"
        >
          <span>Asistencia</span>
        </a>

        <a
          routerLink="/admin/notas"
          routerLinkActive="active"
          class="menu-item"
        >
          <span>Notas</span>
        </a>

      </div>


      <div class="menu-group">

        <p class="section-title">
          ADMINISTRACIÓN
        </p>

        <a
          routerLink="/admin/usuarios"
          routerLinkActive="active"
          class="menu-item"
        >
          <span>Usuarios</span>
        </a>

      </div>

    </nav>

  </div>


  <div class="logout">

    <button
      type="button"
      class="logout-link"
      (click)="cerrarSesion()"
    >
      <span class="logout-icon">↪</span>
      <span>CERRAR SESIÓN</span>
    </button>

  </div>

</div>
