<header class="topbar">

  <div class="logo">
    <img src="assets/img/Logo-nav.png" alt="Edu Planner">
  </div>

  <nav class="breadcrumb" aria-label="breadcrumb">
    <span
      *ngFor="let item of breadcrumb; let last = last"
      class="crumb"
      [class.is-last]="last && !extra"
    >
      {{ item }}
      <span class="sep" *ngIf="!last || extra">&rsaquo;</span>
    </span>
    <span class="crumb is-last" *ngIf="extra">{{ extra }}</span>
  </nav>

  <div class="topbar-right">
    <div class="user-info">
      <span class="user-role">{{ rolUsuario }}</span>
      <span class="user-subtitle">{{ nombreUsuario || 'Sesión activa · EduPlanner' }}</span>
    </div>

    <div class="avatar">
      <img src="assets/img/profile.png" alt="Perfil del administrador">
    </div>
  </div>

</header>
