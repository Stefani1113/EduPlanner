worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Formato de log en modo "debug" (equivalente a logLevel: debug del ejemplo original)
    log_format debug_proxy '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'upstream: $upstream_addr, tiempo: $upstream_response_time s';

    # Para logs de tipo "debug" reales en nginx se necesita compilar con --with-debug
    # y usar: error_log /var/log/nginx/error.log debug;
    error_log  /var/log/nginx/error.log debug;

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log debug_proxy;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway_upstream http://gateway:8080;

        root /usr/share/nginx/html;
        index index.html;

        # ---------- Angular (SPA) ----------
        # Cualquier ruta que no matchee los proxies de abajo
        # se sirve como index.html para que el router de Angular la maneje.
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/(autenticacion|administracion|gestion-academica|notas|ia|configuracion-institucional)(/|$) {
                proxy_pass $gateway_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header Origin "";
                proxy_read_timeout 120s;
        }
    }
}