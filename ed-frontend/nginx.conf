worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Formato de log en modo "debug" (equivalente a logLevel: debug del ejemplo original)
    log_format debug_proxy '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'upstream: $upstream_addr, tiempo: $upstream_response_time s';

    # Para logs de tipo "debug" reales en nginx se necesita compilar con --with-debug
    # y usar: error_log /var/log/nginx/error.log debug;
    error_log  /var/log/nginx/error.log debug;

    upstream gateway {
        server localhost:8080;
    }

    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log debug_proxy;

        root /usr/share/nginx/html;
        index index.html;

        # ---------- Angular (SPA) ----------
        # Cualquier ruta que no matchee los proxies de abajo
        # se sirve como index.html para que el router de Angular la maneje.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------- /autenticacion ----------
        location /autenticacion {
            proxy_pass http://gateway;
            proxy_ssl_verify off;             # equivalente a "secure": false
            proxy_set_header Host $host;      # equivalente a "changeOrigin": true
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- /administracion ----------
        location /administracion {
            proxy_pass http://gateway;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- /gestion-academica ----------
        location /gestion-academica {
            proxy_pass http://gateway;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- /notas ----------
        location /notas {
            proxy_pass http://gateway;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- /ia ----------
        location /ia {
            proxy_pass http://gateway;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- /configuracion-institucional ----------
        location /configuracion-institucional {
            proxy_pass http://gateway;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}