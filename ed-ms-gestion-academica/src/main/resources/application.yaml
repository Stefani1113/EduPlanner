spring:
  application:
    name: ed-ms-gestion-academica

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        enabled: true
        register: true
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /eduplanner/actuator/health

  datasource:
    url: jdbc:mysql://localhost:3306/academic_management
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8083
  servlet:
    context-path: /eduplanner/

security:
  jwt:
    secret-key: czyYSEj017tCB8M8mnOSvhgV4gSdI4P5Bql+3HrWZtM=

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never